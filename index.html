function folderSVG(lock=false){return `<svg width="40" height="34" viewBox="0 0 40 34" fill="none" aria-hidden="true"><path d="M4 8.5A3.5 3.5 0 0 1 7.5 5H16l3 3h13.5A3.5 3.5 0 0 1 36 11.5v14a3.5 3.5 0 0 1-3.5 3.5h-25A3.5 3.5 0 0 1 4 25.5z" fill="currentColor" opacity=".9"/><path d="M4 12h32v13.5a3.5 3.5 0 0 1-3.5 3.5h-25A3.5 3.5 0 0 1 4 25.5z" fill="currentColor"/>${lock?'<rect x="17" y="17" width="8" height="7" rx="1.4" fill="white"/><path d="M19 17v-2a2 2 0 0 1 4 0v2" stroke="white" stroke-width="1.5"/>':''}</svg>`}
function navGuest(active=''){return `<nav class="hero-nav"><a href="#" class="nav-link ${active==='upload'?'active':''}" onclick="go('dropzone');return false">Upload</a><a href="#" class="nav-link ${active==='files'?'active':''}" onclick="go('files');return false">My files</a><a href="#" class="nav-link ${active==='about'?'active':''}" onclick="go('about');return false">About</a><a href="#" class="nav-link" onclick="go('login');return false">Log in / Sign up</a></nav>`}
function navLogged(active='files'){return `<div class="light-nav"><a href="#" class="nav-link ${active==='upload'?'active':''}" onclick="go('dropzone');return false">Upload</a><a href="#" class="nav-link ${active==='files'?'active':''}" onclick="go('files');return false">My files</a><a href="#" class="nav-link ${active==='about'?'active':''}" onclick="go('about');return false">About</a><div class="user-wrap"><button class="user-chip" onclick="toggleDropdown(event)">Paumasia <span class="avatar-globe">◉</span></button><div class="dropdown ${state.dropdown?'open':''}" id="user-dropdown"><div class="dropdown-head"><div><p class="dropdown-name">Paumasia</p><div class="wallet">0x9687fb25...8aa3e0d5</div></div><button class="copy-link" onclick="copyText('https://gatewa...')">Copy link</button></div><div class="dropdown-sep"></div><button class="dropdown-item" onclick="go('mailbox')">Edit avatar</button><button class="dropdown-item" onclick="toast('Mailbox export is a visual demo')">Export mailbox</button></div></div></div>`}
function hero(slide=0,copyType='main',nav='guest',active=''){
 let art=slide%3===0?waveSVG():slide%3===1?`<div class="wood-planks"></div>`:leafSVG();let cls=slide%3===0?'wave-bg':slide%3===1?'wood-bg':'leaf-bg';
 let title=copyType==='inbox'?'My honest inbox':'An easy and secure way to send your files';let sub=copyType==='inbox'?'Receive a message without censorship or tracking':'No central server · No tracking · No backdoors';
 if(copyType==='main'&&slide%3===1)sub='Private transfers, with nothing left behind';if(copyType==='main'&&slide%3===2)sub='Your files. Your privacy. Your choice.';
 return `<section class="hero ${cls}">${art}<div class="hero-vignette"></div>${nav==='guest'?navGuest(active):''}<div class="hero-copy ${copyType==='drop'?'dropzone-hero-copy':''}" id="hero-copy"><h1 class="hero-title">${title}</h1><p class="hero-subline">${sub}</p>${copyType==='inbox'?'<button class="hero-button" onclick="toast(\'Inbox preview opened\')">View my honest inbox</button>':''}<div class="dots">${[0,1,2].map((d)=>`<button class="dot ${(copyType==='inbox'?d===1:d===slide)?'active':''}" aria-label="Show slide ${d+1}" onclick="setHeroSlide(${d},'${copyType}')"></button>`).join('')}</div></div></section>`
}
function renderUpload(){return `<div class="split-screen"><section class="left-panel">${brand()}<div class="upload-content"><div class="tabs"><button class="tab ${state.transfer==='quick'?'active':''}" onclick="setTransfer('quick')">Quick transfer</button><button class="tab ${state.transfer==='encrypted'?'active':''}" onclick="setTransfer('encrypted')">Encrypted transfer</button><span class="tab-underline" style="width:${state.transfer==='quick'?'85px':'111px'};transform:translateX(${state.transfer==='quick'?'0':'111px'})"></span></div><p class="helper">Send files to anyone. Quick and easy</p><button class="file-card" onclick="go('dropzone')" aria-label="Change selected file"><span class="file-icon">${icon('image',18)}</span><span class="file-copy"><span class="file-name" title="${escapeHtml(state.filename)}">${escapeHtml(state.filename)}</span><span class="file-size">${escapeHtml(state.filesize)}</span></span></button><button class="pill left-cta" onclick="go('encrypting')">Get transfer link</button><button class="micro-action" onclick="go('dropzone')">Choose another file</button></div><span class="screen-label">A · Main upload</span></section>${hero(state.heroSlide,'main','guest','upload')}</div>`}
function renderDropzone(){return `<div class="split-screen"><section class="dropzone-panel">${brand()}<div class="dropzone-stack"><button class="dropzone ${state.transfer==='quick'?'selected':''}" onclick="setTransfer('quick');openPicker()" ondragover="dragOver(event,this)" ondragleave="dragLeave(this)" ondrop="dropFile(event)"><span class="folder ${state.transfer==='quick'?'':'pale'}" style="color:${state.transfer==='quick'?'#b9a4f0':'#c7b6f2'}">${folderSVG(false)}</span><span class="drop-title">Quick transfer</span><span class="drop-help">Drop your file here</span></button><button class="dropzone ${state.transfer==='encrypted'?'selected':''}" onclick="setTransfer('encrypted');openPicker()" ondragover="dragOver(event,this)" ondragleave="dragLeave(this)" ondrop="dropFile(event)"><span class="folder" style="color:var(--purple)">${folderSVG(true)}</span><span class="drop-title">Encrypted transfer</span><span class="drop-help">Drop your file here</span></button></div><span class="screen-label">B · Dropzone state</span></section>${hero(state.heroSlide,'drop','guest','upload')}</div>`}
function renderProgress(){const slide=state.heroSlide%3;const heroArt=slide===0?waveSVG():(slide===1?leafSVG():'<div class="wood-planks"></div>');const heroClass=slide===0?'wave-bg':(slide===1?'leaf-bg':'wood-bg');const title=slide===1?'My honest inbox':'An easy and secure way to send your files';const sub=slide===1?'Receive a message without censorship or tracking':(slide===0?'No central server · No tracking · No backdoors':'Private transfers, with nothing left behind');return `<div class="split-screen"><section class="progress-panel"><div class="progress-center"><div class="progress-ring"><span class="progress-value">70%</span></div><p class="progress-caption">Encrypting...Using 256 Military<br>encryption technology</p><button class="outline-pill" onclick="go('upload')">Cancel</button></div><span class="screen-label">C · Encrypting progress</span></section><section class="hero ${heroClass}">${heroArt}<div class="${slide===1?'shade':'hero-vignette'}"></div>${navGuest('')}<div class="hero-copy"><h1 class="hero-title">${title}</h1><p class="hero-subline">${sub}</p>${slide===1?'<button class="hero-button" onclick="toast(\'Inbox preview opened\')">View my honest inbox</button>':''}<div class="dots">${[0,1,2].map((d)=>`<button class="dot ${d===slide?'active':''}" onclick="setHeroSlide(${d},'progress')" aria-label="Show slide ${d+1}"></button>`).join('')}</div></div><span class="screen-label">Inbox · Hero</span></section></div>`}
function fileIcon(kind){return `<span class="type-icon" style="color:${kind==='pdf'?'#b49bed':kind==='audio'?'#7133db':kind==='video'?'#7133db':'#a992ea'}">${icon(kind,16)}</span>`}
function renderRows(){return fileRows.map((r,i)=>`<tr class="${state.selected===i&&state.screen==='filedetail'?'selected-row':''}" onclick="selectFile(${i})"><td><div class="name-cell">${fileIcon(r.kind)}<span title="${r.name}">${r.name}</span></div></td><td>${r.to}</td><td>${r.date}</td><td>${r.size}</td></tr>`).join('')}
function renderDetailPanel(){let r=fileRows[state.selected]||fileRows[0];return `<aside class="detail-panel"><div class="detail-panel-inner"><div class="detail-thumb">${thumbnailSVG()}</div><p class="detail-filename">${r.name}</p><p class="detail-meta">${r.meta}</p><div class="joined-field"><input aria-label="Transfer link" readonly value="https://gateway.fairdrop.io/${r.name.slice(0,8)}..."/><button onclick="copyText('https://gateway.fairdrop.io/${r.name.slice(0,8)}...')">Copy link</button></div><button class="delete-pill" onclick="deleteFile()">Delete file</button></div></aside>`}
function renderFiles(detail=false){return `<main class="files-page"><header class="files-header">${navLogged('files')}</header><div class="files-layout ${detail?'with-detail':''}">${detail?`<aside class="mini-sidebar"><button onclick="toast('Consents selected')">Consents</button><button onclick="toast('My honest inbox selected')">My honest inbox</button></aside>`:''}<section class="table-area"><table class="file-table"><colgroup><col><col><col><col></colgroup><thead><tr><th>Name</th><th>Sent to</th><th>Date</th><th>Size</th></tr></thead><tbody>${renderRows()}</tbody></table></section>${detail?renderDetailPanel():''}</div><span class="screen-label">${detail?'E · File detail side panel':'D · My files table'}</span></main>`}
function renderLogin(){return `<main class="auth-screen"><section class="auth-card"><div class="auth-art">${crystalSVG()}<div class="auth-art-copy">The easiest way to send your files privately</div></div><div class="auth-form"><div class="auth-topline"><button class="text-button" onclick="go('upload')">✕ Close</button><button class="text-button sign-up-link" onclick="go('mailbox')">Not a member? <span>Sign up</span></button></div><div class="brand auth-logo">Fairdrop</div><p class="auth-subtitle">Log in to your account</p><button class="auth-option" onclick="toast('Wallet connection is a visual demo')"><span class="option-icon">🦊</span>Connect with Metamask</button><button class="auth-option" onclick="go('mailbox')"><span class="option-icon">${icon('download',18)}</span>Import Mailbox</button><div class="or-divider">Or</div><label class="field-label" for="login-mailbox">Mailbox</label><input class="text-field" id="login-mailbox" placeholder="Enter mailbox name" value="" oninput="this.classList.toggle('invalid',false)" /><p class="auth-note">Use your mailbox name to continue.</p></div></section><span class="screen-label">F · Login modal</span></main>`}
function renderMailbox(){return `<main class="mailbox-screen"><aside class="mailbox-art">${crystalSVG()}</aside><section class="mailbox-main"><div class="mailbox-content"><div class="brand">Fairdrop</div><p class="mailbox-subtitle">Edit your mailbox details to finalize</p><div class="wallet-row"><div class="fox-avatar">${icon('fox',27)}</div><div class="wallet-lines"><span class="wallet-address">0x9687fb25bd...8aa3e0d526</span><button class="avatar-edit" onclick="toast('Avatar picker is a visual demo')">Edit avatar</button></div></div><label class="field-label" for="mailbox-name">Mailbox</label><div class="mailbox-field-wrap"><input class="text-field" id="mailbox-name" value="${escapeHtml(state.mailbox)}" oninput="validateMailbox(this.value)"/><span class="valid-check" id="valid-check" style="display:${state.mailboxValid?'grid':'none'}">${icon('check',17)}</span></div><button class="pill mailbox-finish" onclick="finishMailbox()">Finish</button></div></section><span class="screen-label">G · Create mailbox</span></main>`}
function renderAbout(){return `<main class="about-page"><header class="about-header">About Fairdrop</header><div class="about-body"><nav class="about-menu">${['Why Fairdrop?','About Fair Data Society','FAQs','Terms of usage'].map(item=>`<button class="${state.aboutActive===item?'active':''}" onclick="setAbout('${item}')">${item}</button>`).join('')}</nav><section class="about-content"><svg class="dotted-mark" viewBox="0 0 48 48" aria-label="Fair Data Society dotted mark">${Array.from({length:28},(_,i)=>{let a=2*Math.PI*i/28-Math.PI/2;let x=24+17*Math.cos(a),y=24+17*Math.sin(a);return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.45" fill="#151515"/>`}).join('')}</svg><div class="fds-badge"><span>FAIR DATA</span><span>SOCIETY</span></div></section></div><span class="screen-label">H · About page</span></main>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){state.dropdown=false;app.innerHTML=({upload:renderUpload,dropzone:renderDropzone,encrypting:renderProgress,files:()=>renderFiles(false),filedetail:()=>renderFiles(true),login:renderLogin,mailbox:renderMailbox,about:renderAbout}[state.screen]||renderUpload)();if(state.screen==='files'||state.screen==='filedetail'){const drop=document.getElementById('user-dropdown');if(drop&&state.dropdown)drop.classList.add('open')}}
function go(screen){if(screen==='dropzone'&&state.screen==='upload'){state.transfer='encrypted';state.heroSlide=1}if(screen==='encrypting')state.heroSlide=1;state.screen=screen;state.dropdown=false;render();window.scrollTo(0,0)}
function setTransfer(value){state.transfer=value;if(state.screen==='upload'){document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&value==='quick')||(i===1&&value==='encrypted')));const line=document.querySelector('.tab-underline');if(line){line.style.width=value==='quick'?'85px':'111px';line.style.transform=value==='quick'?'translateX(0)':'translateX(111px)'}}else{render()}}
function openPicker(){document.getElementById('file-picker').click()}
document.getElementById('file-picker').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f){state.filename=f.name;state.filesize=f.size<1048576?Math.max(1,Math.round(f.size/1024))+' KB':(f.size/1048576).toFixed(1)+' MB';go('upload')}});
function dragOver(e,el){e.preventDefault();el.classList.add('dragging')};function dragLeave(el){el.classList.remove('dragging')};function dropFile(e){e.preventDefault();e.currentTarget.classList.remove('dragging');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f){state.filename=f.name;state.filesize=f.size<1048576?Math.max(1,Math.round(f.size/1024))+' KB':(f.size/1048576).toFixed(1)+' MB';go('upload')}}
function toggleDropdown(e){e.stopPropagation();state.dropdown=!state.dropdown;const el=document.getElementById('user-dropdown');if(el)el.classList.toggle('open',state.dropdown)}
document.addEventListener('click',e=>{if(!e.target.closest('.user-wrap')&&state.dropdown){state.dropdown=false;const d=document.getElementById('user-dropdown');if(d)d.classList.remove('open')}});
function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).catch(()=>{});toast('Link copied')}
function selectFile(i){state.selected=i;state.screen='filedetail';render()}
function deleteFile(){toast('Delete confirmation is not connected');}
function validateMailbox(value){state.mailbox=value;state.mailboxValid=/^[a-zA-Z0-9_-]{3,20}$/.test(value);const inp=document.getElementById('mailbox-name'),check=document.getElementById('valid-check');if(inp){inp.style.borderColor=state.mailboxValid?'#e0e0e5':'#E5484D';inp.style.boxShadow=state.mailboxValid?'':'0 0 0 2px rgba(229,72,77,.06)'}if(check)check.style.display=state.mailboxValid?'grid':'none'}
function finishMailbox(){if(!state.mailboxValid){toast('Use 3–20 letters, numbers, _ or -');return}toast('Mailbox details saved in this demo');go('files')}
function setAbout(item){state.aboutActive=item;render()}
function setHeroSlide(slide,type){state.heroSlide=slide;const copy=document.getElementById('hero-copy');if(copy){copy.classList.add('fading');setTimeout(()=>{if(state.screen==='upload'){render()}else if(state.screen==='dropzone'){render()}else if(state.screen==='encrypting'){render()}},120)}else{render()}}
// Static interaction prototype: carousel rotates through atmospheric scenes every five seconds on hero screens.
setInterval(()=>{if(['upload','dropzone','encrypting'].includes(state.screen)){const copy=document.querySelector('.hero-copy');if(copy)copy.classList.add('fading');setTimeout(()=>{if(['upload','dropzone','encrypting'].includes(state.screen)){state.heroSlide=(state.heroSlide+1)%3;render()}},180)}},5000);
render();
</script>
</body>
</html>
