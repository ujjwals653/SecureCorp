# SecureCorp Docker Compose Configuration
# Ports match PROJECT_CONTEXT.md §9 dev defaults:
#   - Backend (Flask REST API): 5000
#   - Frontend (React UI): 3000
#   - IDS Dashboard (Intrusion Detection): 5001

services:
  backend:
    build:
      context: .
      dockerfile: modules/backend/Dockerfile
    container_name: securecorp-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DB_PATH=/app/modules/backend/data/securecorp.db
      - IDS_INGEST_URL=http://ids-dashboard:5001/api/ingest
      - IDS_ALERTS_URL=http://ids-dashboard:5001/api/alerts
    env_file:
      - path: ./modules/backend/.env
        required: false
    volumes:
      - backend-data:/app/modules/backend/data
    networks:
      - securecorp-net

  frontend:
    build:
      context: .
      dockerfile: modules/frontend/Dockerfile
    container_name: securecorp-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
      - VITE_USE_MOCK=false
    env_file:
      - path: ./modules/frontend/.env
        required: false
    depends_on:
      - backend
    networks:
      - securecorp-net

  ids-dashboard:
    build:
      context: .
      dockerfile: modules/ids/Dockerfile
    container_name: securecorp-ids-dashboard
    ports:
      - "5001:5001"
    environment:
      - HOST=0.0.0.0
      - PORT=5001
    depends_on:
      - backend
    networks:
      - securecorp-net

volumes:
  backend-data:
    name: securecorp-backend-data

networks:
  securecorp-net:
    name: securecorp-network
